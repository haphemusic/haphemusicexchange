<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>HAPHEMUSIC - Community</title>
    <meta name="description" content="Community discussions for HAPHEMUSIC. Share posts, comment, and connect with contemporary music creators.">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/auth.js"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "surface-container-low": "#0d1c2d",
              "surface-container-lowest": "#010f1f",
              "on-surface": "#d4e4fa",
              "salmon": "#E57373",
              "tertiary-container": "#8b96ac"
            },
            "fontFamily": {
              "body-md": ["Outfit"],
              "headline-md": ["Outfit"],
              "display-xl": ["Outfit"],
              "label-sm": ["Outfit"]
            }
          }
        }
      }
    </script>
    <style>
        html {
            scroll-behavior: smooth;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .glass-panel {
            background: rgba(39, 54, 71, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .text-salmon { color: #E57373; }
        .bg-salmon { background-color: #E57373; }
        .border-salmon { border-color: #E57373; }
        .cascade-wrapper { position: relative; }
        .cascade-menu {
            display: none;
            position: relative;
            margin-top: 8px;
            z-index: 9999;
            min-width: 100%;
            background: #0d1c2d;
            border: 1px solid rgba(229, 115, 115, 0.4);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            padding: 8px 0;
            backdrop-filter: blur(25px);
            animation: slideDown 0.2s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .cascade-item {
            padding: 12px 16px;
            color: #d4e4fa;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .cascade-item:hover {
            background: rgba(229, 115, 115, 0.15);
            color: #E57373;
        }
        .cascade-item::after {
            content: '›';
            font-size: 16px;
            color: rgba(212,228,250,0.4);
            display: none;
        }
        .cascade-item:has(.cascade-submenu)::after {
            display: block;
        }
        .cascade-submenu {
            display: none;
            position: absolute;
            top: -8px;
            left: 100%;
            margin-left: 2px;
            min-width: 240px;
            background: #0d1c2d;
            border: 1px solid rgba(229, 115, 115, 0.4);
            border-radius: 12px;
            padding: 8px 0;
            box-shadow: 20px 20px 50px rgba(0,0,0,0.8);
            z-index: 10000;
            animation: slideRight 0.15s ease-out;
        }
        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-6px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .cascade-item:hover > .cascade-submenu {
            display: block;
        }
        .tag-enter {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .work-card {
            background: rgba(13, 28, 45, 0.6);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 24px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .work-card:hover {
            transform: translateY(-3px);
            border-color: rgba(229,115,115,0.35);
            box-shadow: 0 16px 40px rgba(0,0,0,0.4);
        }
        .glass-panel { background: rgba(39, 54, 71, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .post-card-clickable {
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .post-card-clickable:hover {
            transform: translateY(-2px);
            border-color: rgba(229,115,115,0.35) !important;
            box-shadow: 0 12px 40px rgba(229,115,115,0.12);
        }
        #post-detail-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(12px);
            z-index: 99999;
            align-items: flex-start;
            justify-content: center;
            padding: 24px;
            overflow-y: auto;
        }
        #post-detail-modal {
            background: #0d1c2d;
            border: 1px solid rgba(229,115,115,0.2);
            border-radius: 24px;
            max-width: 680px;
            width: 100%;
            margin: auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .comment-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            padding: 14px 16px;
            transition: border-color 0.2s;
        }
        .comment-item:hover {
            border-color: rgba(229,115,115,0.2);
        }
        .vote-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #8b96ac;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .vote-btn:hover {
            background: rgba(229,115,115,0.15);
            border-color: rgba(229,115,115,0.4);
            color: #E57373;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-md selection:bg-salmon selection:text-white">
<nav class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-8 h-20 bg-slate-950/80 backdrop-blur-xl border-b border-white/10">
    <div class="flex items-center gap-12">
        <a href="index.html" class="text-2xl font-bold tracking-tighter text-white hover:text-salmon transition-all duration-300">HAPHEMUSIC</a>
    </div>
    <div class="absolute left-1/2 -translate-x-1/2 hidden md:flex items-center gap-8 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400">
        <a class="hover:text-salmon transition-colors" href="index.html">Home</a>
        <a class="hover:text-salmon transition-colors" href="index.html#about-section">About</a>
    </div>
    <div class="flex items-center gap-4" id="auth-header">
        <a href="index.html" class="px-4 py-2 rounded-full border border-white/10 text-white font-sans font-medium hover:bg-white/5 transition-all duration-300">Home</a>
        <button onclick="window.openCreatePostModal()" class="px-4 py-2 rounded-xl bg-salmon text-white text-sm font-semibold hover:brightness-110 active:scale-[0.98] transition-all duration-300">New Post</button>
    </div>
</nav>
<main class="max-w-6xl mx-auto px-8 pt-28 pb-24">
    <section class="mt-12 space-y-8">
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 bg-slate-950/70 border border-white/10 rounded-3xl p-8 glass-panel">
            <div>
                <h1 class="font-headline-lg text-4xl font-semibold text-white">Community Discussions</h1>
                <p class="text-tertiary-container text-sm mt-2">Ask questions, share ideas, and connect with contemporary music creators.</p>
            </div>
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3">
                <div class="relative flex items-center bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white hover:border-salmon/50 transition-colors">
                    <span class="material-symbols-outlined text-[16px] text-slate-400 mr-1.5">filter_list</span>
                    <select id="forum-sort-select" onchange="window.loadPosts()" style="background: transparent; border: none; color: white; outline: none; cursor: pointer;" class="pr-1">

                    </select>

                <button onclick="window.openCreatePostModal()" class="px-5 py-2.5 bg-salmon hover:brightness-110 active:scale-95 text-white font-sans text-xs font-semibold uppercase tracking-wider rounded-xl transition-all duration-300 flex items-center gap-2">
                    <span class="material-symbols-outlined text-[16px]">add_comment</span> New Post

            <div class="flex justify-center items-center py-20 bg-white/5 rounded-3xl border border-white/10">

            </div>
        </div>
    </section>
</main>

<!-- Create Post Modal -->
<div id="create-post-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 99998; align-items: center; justify-content: center; padding: 24px;">
    <div style="background: #0d1c2d; border: 1px solid rgba(229,115,115,0.25); border-radius: 24px; max-width: 580px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; position: relative;">
        <div style="padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3 style="font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 2px;">Create Discussion</h3>
                <p style="font-size: 11px; color: #8b96ac; text-transform: uppercase; letter-spacing: 0.05em;">Start a new community topic</p>
            </div>
            <button onclick="window.closeCreatePostModal()" style="background: rgba(255,255,255,0.06); border: none; color: #d4e4fa; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;" class="hover:bg-white/10">
                <span class="material-symbols-outlined text-[18px]">close</span>
            </button>
        </div>
        <form onsubmit="window.handleCreatePostSubmit(event)" style="padding: 24px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;">
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-semibold uppercase tracking-wider font-sans">Title</label>
                <input type="text" id="post-title-input" required placeholder="What is your topic about?" style="width: 100%;" class="h-11 bg-white/5 border border-white/10 rounded-xl px-4 text-white focus:outline-none focus:border-salmon transition-colors">
            </div>
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-semibold uppercase tracking-wider font-sans">Content</label>
                <textarea id="post-content-input" required rows="4" placeholder="Write your post content here..." style="width: 100%; resize: none;" class="bg-white/5 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-salmon transition-colors"></textarea>
            </div>
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-semibold uppercase tracking-wider font-sans">Image (Optional)</label>
                <div class="flex gap-3 items-center">
                    <div class="flex-1 relative h-20 bg-white/5 border border-dashed border-white/10 rounded-xl overflow-hidden group">
                        <label class="absolute inset-0 flex flex-col items-center justify-center cursor-pointer hover:bg-white/5 transition-all duration-300">
                            <div class="flex flex-col items-center justify-center text-center" id="upload-placeholder">
                                <span class="material-symbols-outlined text-slate-400 group-hover:text-salmon transition-colors">cloud_upload</span>
                                <p class="text-[10px] text-slate-400 font-sans mt-1">Upload from computer</p>
                            </div>
                            <img id="post-image-preview" class="hidden absolute inset-0 w-full h-full object-cover">
                            <input type="file" id="post-file-input" accept="image/*" class="hidden" onchange="window.handlePostFileChange(this)">
                        </label>
                        <button type="button" id="clear-post-image-btn" onclick="window.clearPostFile(event)" class="hidden absolute top-2 right-2 z-10 w-6 h-6 bg-slate-950/80 hover:bg-salmon text-white rounded-full flex items-center justify-center transition-all duration-300">
                            <span class="material-symbols-outlined text-[14px]">close</span>
                        </button>
                    </div>
                    <div class="text-xs text-slate-500 font-sans uppercase shrink-0">or</div>
                    <input type="url" id="post-media-input" placeholder="Paste image URL..." class="flex-1 h-11 bg-white/5 border border-white/10 rounded-xl px-4 text-white focus:outline-none focus:border-salmon transition-colors text-sm">
                </div>
            </div>
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-semibold uppercase tracking-wider font-sans">External Link (Optional)</label>
                <input type="url" id="post-link-input" placeholder="https://example.com/score-or-video" style="width: 100%;" class="h-11 bg-white/5 border border-white/10 rounded-xl px-4 text-white focus:outline-none focus:border-salmon transition-colors">
            </div>
            <button type="submit" class="mt-2 w-full h-11 bg-salmon hover:brightness-110 active:scale-95 text-white font-sans text-xs font-semibold uppercase tracking-wider rounded-xl transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-[16px]">publish</span> Publish Post
            </button>
        </form>
    </div>
</div>

<!-- Post Detail Modal -->
<div id="post-detail-backdrop" onclick="window.closePostDetail(event)" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(12px);z-index:99999;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;">
    <div id="post-detail-modal" style="background:#0d1c2d;border:1px solid rgba(229,115,115,0.2);border-radius:24px;max-width:680px;width:100%;margin:auto;display:flex;flex-direction:column;overflow:hidden;position:relative;">
        <!-- Header -->
        <div style="padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0d1c2d;z-index:10;">
            <div id="post-detail-author" style="display:flex;align-items:center;gap:12px;"></div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div id="post-detail-votes" style="display:flex;align-items:center;gap:6px;"></div>
                <button onclick="window.closePostDetailBtn()" style="background:rgba(255,255,255,0.06);border:none;color:#d4e4fa;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <span class="material-symbols-outlined" style="font-size:18px;">close</span>
                </button>
            </div>
        </div>
        <!-- Body -->
        <div style="padding:24px;">
            <h2 id="post-detail-title" style="font-size:22px;font-weight:800;color:#fff;margin-bottom:12px;line-height:1.3;"></h2>
            <p id="post-detail-content" style="font-size:14px;color:#94a3b8;line-height:1.7;margin-bottom:16px;"></p>
            <div id="post-detail-media" style="margin-bottom:16px;"></div>
            <div id="post-detail-link" style="margin-bottom:8px;"></div>
        </div>
        <!-- Comments Section -->
        <div style="padding:0 24px 24px;">
            <div style="border-top:1px solid rgba(255,255,255,0.07);padding-top:20px;">
                <h4 style="font-size:13px;font-weight:700;color:#d4e4fa;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:16px;display:flex;align-items:center;">
                    <span class="material-symbols-outlined" style="font-size:16px;color:#E57373;margin-right:6px;">chat_bubble</span>
                    Comments <span id="post-detail-comment-count" style="color:#8b96ac;font-weight:400;margin-left:6px;"></span>
                </h4>
                <div id="post-detail-comments" style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">
                    <div style="text-align:center;padding:20px;">
                        <span class="material-symbols-outlined" style="font-size:32px;color:#334155;">sync</span>
                    </div>
                </div>
                <!-- Add comment form (shown when logged in) -->
                <div id="post-detail-comment-form" style="display:none;">
                    <div style="display:flex;gap:10px;align-items:flex-start;">
                        <textarea id="new-comment-input" rows="2" placeholder="Write a comment..." style="flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 14px;color:#d4e4fa;font-family:Outfit,sans-serif;font-size:13px;resize:none;outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='rgba(229,115,115,0.5)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'"></textarea>
                        <button onclick="window.submitComment()" style="background:#E57373;border:none;color:white;padding:10px 16px;border-radius:12px;cursor:pointer;font-family:Outfit,sans-serif;font-size:12px;font-weight:700;white-space:nowrap;transition:all 0.2s;display:flex;align-items:center;gap:6px;" onmouseover="this.style.filter='brightness(1.1)'" onmouseout="this.style.filter='brightness(1)'">
                            <span class="material-symbols-outlined" style="font-size:16px;">send</span> Post
                        </button>
                    </div>
                </div>
                <!-- Login prompt (shown when not logged in) -->
                <div id="post-detail-login-prompt" style="display:none;text-align:center;padding:16px;background:rgba(255,255,255,0.03);border-radius:12px;border:1px dashed rgba(255,255,255,0.1);">
                    <p style="font-size:13px;color:#8b96ac;margin-bottom:10px;">Log in to join the conversation</p>
                    <a href="login.html" style="background:#E57373;color:white;padding:8px 20px;border-radius:10px;font-size:12px;font-weight:700;text-decoration:none;">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.openCreatePostModal = async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            alert("Please log in to participate in the community discussions.");
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('create-post-backdrop').style.display = 'flex';
    };

    window.closeCreatePostModal = () => {
        document.getElementById('create-post-backdrop').style.display = 'none';
        document.getElementById('post-title-input').value = '';
        document.getElementById('post-content-input').value = '';
        document.getElementById('post-media-input').value = '';
        document.getElementById('post-link-input').value = '';
        window.clearPostFile();
    };

    window.handlePostFileChange = (input) => {
        const file = input.files[0];
        const preview = document.getElementById('post-image-preview');
        const placeholder = document.getElementById('upload-placeholder');
        const clearBtn = document.getElementById('clear-post-image-btn');
        const urlInput = document.getElementById('post-media-input');

        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                clearBtn.classList.remove('hidden');
                urlInput.value = '';
                urlInput.disabled = true;
            };
            reader.readAsDataURL(file);
        }
    };

    window.clearPostFile = (e) => {
        if (e) e.stopPropagation();
        const input = document.getElementById('post-file-input');
        const preview = document.getElementById('post-image-preview');
        const placeholder = document.getElementById('upload-placeholder');
        const clearBtn = document.getElementById('clear-post-image-btn');
        const urlInput = document.getElementById('post-media-input');

        if (input) input.value = '';
        if (preview) {
            preview.src = '';
            preview.classList.add('hidden');
        }
        if (placeholder) placeholder.classList.remove('hidden');
        if (clearBtn) clearBtn.classList.add('hidden');
        if (urlInput) {
            urlInput.disabled = false;
        }
    };

    window.handleCreatePostSubmit = async (e) => {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalBtnHTML = submitBtn ? submitBtn.innerHTML : 'Publish Post';

        const title = document.getElementById('post-title-input').value.trim();
        const content = document.getElementById('post-content-input').value.trim();
        let mediaUrl = document.getElementById('post-media-input').value.trim();
        const externalLink = document.getElementById('post-link-input').value.trim();
        const fileInput = document.getElementById('post-file-input');

        if (!title || !content) return;

        try {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return;
            const currentUserId = session.user.id;

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<span class="material-symbols-outlined text-[16px] animate-spin">sync</span> Uploading...`;
            }

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `posts/${currentUserId}-${Date.now()}.${fileExt}`;

                const { error: uploadError } = await supabase.storage
                    .from('Avatar')
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                const { data: { publicUrl } } = supabase.storage
                    .from('Avatar')
                    .getPublicUrl(fileName);

                mediaUrl = publicUrl;
            }

            const { error } = await supabase
                .from('posts')
                .insert({
                    title,
                    content,
                    media_url: mediaUrl || null,
                    external_link: externalLink || null,
                    author_id: currentUserId
                });

            if (error) throw error;

            window.closeCreatePostModal();
            window.loadPosts();

        } catch (err) {
            console.error("Error creating post:", err);
            alert("Failed to create post: " + (err.message || err));
        } finally {
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHTML;
            }
        }
    };

    window.loadPosts = async () => {
        const container = document.getElementById('forum-posts-container');
        if (!container) return;

        const sortSelect = document.getElementById('forum-sort-select');
        const sortBy = sortSelect ? sortSelect.value : 'newest';

        try {
            const { data: posts, error } = await supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;
            if (!posts || posts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 bg-white/5 rounded-3xl border border-white/10">
                        <span class="material-symbols-outlined text-6xl text-slate-600 mb-4">forum</span>
                        <h3 class="text-xl text-white font-medium">No discussions yet</h3>
                        <p class="text-slate-400">Be the first to share something with the community!</p>
                    </div>
                `;
                return;
            }

            const authorIds = [...new Set(posts.map(p => p.author_id))];
            const { data: profiles, error: pError } = await supabase
                .from('profiles')
                .select('id, first_name, last_name, avatar_url')
                .in('id', authorIds);
            if (pError) throw pError;

            const { data: comments, error: cError } = await supabase
                .from('comments')
                .select('post_id');
            if (cError) throw cError;

            let votes = [];
            try {
                const { data: vData, error: vError } = await supabase.from('votes').select('*');
                if (!vError && vData) votes = vData;
            } catch (vErr) {
                console.warn("Failed to fetch votes:", vErr);
            }

            if (sortBy === 'top') {
                posts.sort((a, b) => {
                    const scoreA = votes.filter(v => v.post_id === a.id).reduce((acc, curr) => acc + curr.vote_type, 0);
                    const scoreB = votes.filter(v => v.post_id === b.id).reduce((acc, curr) => acc + curr.vote_type, 0);
                    return scoreB - scoreA;
                });
            }

            container.innerHTML = posts.map(p => {
                const profile = profiles.find(pr => pr.id === p.author_id) || { first_name: 'Anonymous', last_name: 'User' };
                const authorName = `${profile.first_name || ''} ${profile.last_name || ''}`.trim() || 'Anonymous User';
                const initials = (profile.first_name ? profile.first_name[0] : '') + (profile.last_name ? profile.last_name[0] : '');

                const postComments = comments.filter(c => c.post_id === p.id);
                const commentsCount = postComments.length;

                const postVotes = votes.filter(v => v.post_id === p.id);
                const score = postVotes.reduce((acc, curr) => acc + curr.vote_type, 0);

                const avatarHTML = profile.avatar_url
                    ? `<img src="${profile.avatar_url}" style="width:40px;height:40px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,0.1);flex-shrink:0;">`
                    : `<div style="width:40px;height:40px;border-radius:10px;background:rgba(229,115,115,0.1);border:1px solid rgba(229,115,115,0.2);display:flex;align-items:center;justify-content:center;color:#E57373;font-weight:700;font-size:13px;flex-shrink:0;">${initials || '?'}</div>`;

                const mediaPreview = p.media_url
                    ? `<div style="width:100%;margin-top:14px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);"><img src="${p.media_url}" style="width:100%;height:180px;object-fit:cover;"></div>`
                    : '';

                const externalLinkHTML = p.external_link
                    ? `<a href="${p.external_link}" target="_blank" onclick="event.stopPropagation()" style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#E57373;background:rgba(229,115,115,0.1);border:1px solid rgba(229,115,115,0.2);padding:4px 10px;border-radius:8px;text-decoration:none;margin-top:10px;"><span class="material-symbols-outlined" style="font-size:12px;">link</span> Link ↗</a>`
                    : '';

                return `
                    <article
                        class="glass-panel post-card-clickable p-6 rounded-3xl border border-white/10"
                        onclick="window.openPostDetail('${p.id}')"
                        role="button"
                        tabindex="0"
                        onkeydown="if(event.key==='Enter')window.openPostDetail('${p.id}')"
                        aria-label="Open post: ${p.title.replace(/'/g, "&apos;")}"
                    >
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;">
                            <div style="display:flex;align-items:center;gap:12px;">
                                ${avatarHTML}
                                <div>
                                    <p style="font-size:14px;font-weight:600;color:#fff;margin:0;">${authorName}</p>
                                    <p style="font-size:11px;color:#64748b;margin:0;">${commentsCount} comment${commentsCount !== 1 ? 's' : ''}</p>
                                </div>
                            </div>
                            <div style="display:flex;align-items:center;gap:10px;">
                                <span style="font-size:12px;font-weight:700;color:${score > 0 ? '#E57373' : score < 0 ? '#22d3ee' : '#94a3b8'}">${score >= 0 ? '+' : ''}${score}</span>
                                <span class="material-symbols-outlined" style="font-size:18px;color:#475569;">chevron_right</span>
                            </div>
                        </div>
                        <h3 style="font-size:18px;font-weight:800;color:#fff;margin-bottom:8px;">${p.title}</h3>
                        <p style="font-size:13px;color:#94a3b8;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${p.content}</p>
                        ${mediaPreview}
                        ${externalLinkHTML}
                    </article>
                `;
            }).join('');

        } catch (err) {
            console.error("Error loading posts:", err);
            const message = err?.message || String(err) || 'An unexpected error occurred.';
            container.innerHTML = `<div class="text-center py-10 text-rose-400 font-sans text-xs"><p>Error loading discussions.</p><p class="mt-2 text-[11px] text-rose-300">${message}</p></div>`;
        }
    };

    // ─── Post Detail Logic ───────────────────────────────────────────
    window._currentPostId = null;

    window.openPostDetail = async (postId) => {
        window._currentPostId = postId;
        const backdrop = document.getElementById('post-detail-backdrop');
        backdrop.style.display = 'flex';
        document.body.style.overflow = 'hidden';

        // Reset
        document.getElementById('post-detail-title').textContent = '';
        document.getElementById('post-detail-content').textContent = '';
        document.getElementById('post-detail-media').innerHTML = '';
        document.getElementById('post-detail-link').innerHTML = '';
        document.getElementById('post-detail-author').innerHTML = '<span class="material-symbols-outlined" style="color:#E57373;animation:spin 1s linear infinite;">sync</span>';
        document.getElementById('post-detail-comments').innerHTML = '<div style="text-align:center;padding:20px;"><span class="material-symbols-outlined" style="font-size:32px;color:#334155;animation:spin 1s linear infinite;">sync</span></div>';

        try {
            // Fetch post
            const { data: post, error: pErr } = await supabase
                .from('posts')
                .select('*')
                .eq('id', postId)
                .single();
            if (pErr) throw pErr;

            // Fetch author profile
            const { data: profile } = await supabase
                .from('profiles')
                .select('id, first_name, last_name, avatar_url')
                .eq('id', post.author_id)
                .single();

            // Fetch votes
            let votes = [];
            try {
                const { data: vData } = await supabase.from('votes').select('*').eq('post_id', postId);
                if (vData) votes = vData;
            } catch {}
            const score = votes.reduce((acc, curr) => acc + curr.vote_type, 0);

            // Render post header
            const authorName = profile ? `${profile.first_name || ''} ${profile.last_name || ''}`.trim() || 'Anonymous' : 'Anonymous';
            const initials = profile ? ((profile.first_name?.[0] || '') + (profile.last_name?.[0] || '')) : '?';
            const avatarHTML = profile?.avatar_url
                ? `<img src="${profile.avatar_url}" style="width:38px;height:38px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,0.1);">`
                : `<div style="width:38px;height:38px;border-radius:10px;background:rgba(229,115,115,0.1);border:1px solid rgba(229,115,115,0.2);display:flex;align-items:center;justify-content:center;color:#E57373;font-weight:700;font-size:13px;">${initials || '?'}</div>`;

            document.getElementById('post-detail-author').innerHTML = `
                ${avatarHTML}
                <div>
                    <p style="font-size:13px;font-weight:600;color:#fff;margin:0;">${authorName}</p>
                    <p style="font-size:11px;color:#64748b;margin:0;">${new Date(post.created_at).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'})}</p>
                </div>
            `;

            document.getElementById('post-detail-votes').innerHTML = `
                <button class="vote-btn" onclick="window.votePost(1)" id="vote-up-btn">
                    <span class="material-symbols-outlined" style="font-size:14px;">thumb_up</span>
                </button>
                <span id="vote-score-display" style="font-size:13px;font-weight:700;color:${score>0?'#E57373':score<0?'#22d3ee':'#94a3b8'};min-width:24px;text-align:center;">${score>=0?'+':''}${score}</span>
                <button class="vote-btn" onclick="window.votePost(-1)" id="vote-down-btn">
                    <span class="material-symbols-outlined" style="font-size:14px;">thumb_down</span>
                </button>
            `;

            document.getElementById('post-detail-title').textContent = post.title;
            document.getElementById('post-detail-content').textContent = post.content;

            if (post.media_url) {
                document.getElementById('post-detail-media').innerHTML = `<div style="border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);"><img src="${post.media_url}" style="width:100%;max-height:340px;object-fit:cover;"></div>`;
            }
            if (post.external_link) {
                document.getElementById('post-detail-link').innerHTML = `<a href="${post.external_link}" target="_blank" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#E57373;background:rgba(229,115,115,0.1);border:1px solid rgba(229,115,115,0.2);padding:5px 12px;border-radius:8px;text-decoration:none;"><span class="material-symbols-outlined" style="font-size:13px;">link</span>${post.external_link} ↗</a>`;
            }

            // Load comments
            await window.loadPostComments(postId);

            // Show/hide comment form based on auth
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('post-detail-comment-form').style.display = 'block';
                document.getElementById('post-detail-login-prompt').style.display = 'none';
            } else {
                document.getElementById('post-detail-comment-form').style.display = 'none';
                document.getElementById('post-detail-login-prompt').style.display = 'block';
            }

        } catch (err) {
            console.error('Error opening post:', err);
        }
    };

    window.loadPostComments = async (postId) => {
        const commentsEl = document.getElementById('post-detail-comments');
        const countEl = document.getElementById('post-detail-comment-count');

        try {
            const { data: comments, error } = await supabase
                .from('comments')
                .select('*')
                .eq('post_id', postId)
                .order('created_at', { ascending: true });
            if (error) throw error;

            // Fetch comment authors
            let profiles = [];
            if (comments && comments.length > 0) {
                const ids = [...new Set(comments.map(c => c.author_id))];
                const { data: pData } = await supabase.from('profiles').select('id, first_name, last_name, avatar_url').in('id', ids);
                if (pData) profiles = pData;
            }

            if (countEl) countEl.textContent = `(${comments?.length || 0})`;

            if (!comments || comments.length === 0) {
                commentsEl.innerHTML = `<div style="text-align:center;padding:24px;background:rgba(255,255,255,0.03);border-radius:14px;border:1px dashed rgba(255,255,255,0.08);"><span class="material-symbols-outlined" style="font-size:32px;color:#334155;display:block;margin-bottom:8px;">chat_bubble</span><p style="font-size:13px;color:#64748b;">No comments yet. Be the first!</p></div>`;
                return;
            }

            commentsEl.innerHTML = comments.map(c => {
                const cp = profiles.find(pr => pr.id === c.author_id);
                const cName = cp ? `${cp.first_name||''} ${cp.last_name||''}`.trim() || 'User' : 'Anonymous';
                const cInitials = cp ? ((cp.first_name?.[0]||'')+(cp.last_name?.[0]||'')) : '?';
                const cAvatar = cp?.avatar_url
                    ? `<img src="${cp.avatar_url}" style="width:30px;height:30px;border-radius:8px;object-fit:cover;border:1px solid rgba(255,255,255,0.1);flex-shrink:0;">`
                    : `<div style="width:30px;height:30px;border-radius:8px;background:rgba(229,115,115,0.08);border:1px solid rgba(229,115,115,0.15);display:flex;align-items:center;justify-content:center;color:#E57373;font-weight:700;font-size:11px;flex-shrink:0;">${cInitials||'?'}</div>`;
                const cDate = new Date(c.created_at).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
                return `
                    <div class="comment-item">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                            ${cAvatar}
                            <div>
                                <p style="font-size:12px;font-weight:600;color:#d4e4fa;margin:0;">${cName}</p>
                                <p style="font-size:10px;color:#64748b;margin:0;">${cDate}</p>
                            </div>
                        </div>
                        <p style="font-size:13px;color:#94a3b8;line-height:1.6;margin:0;">${c.content}</p>
                    </div>
                `;
            }).join('');
        } catch (err) {
            console.error('Error loading comments:', err);
            commentsEl.innerHTML = `<p style="color:#f87171;font-size:13px;">Error loading comments.</p>`;
        }
    };

    window.submitComment = async () => {
        const input = document.getElementById('new-comment-input');
        const content = input?.value?.trim();
        if (!content || !window._currentPostId) return;

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { alert('Please log in to comment.'); return; }

        try {
            const { error } = await supabase.from('comments').insert({
                post_id: window._currentPostId,
                author_id: session.user.id,
                content
            });
            if (error) throw error;
            input.value = '';
            await window.loadPostComments(window._currentPostId);
            window.loadPosts(); // refresh count on cards
        } catch (err) {
            alert('Error posting comment: ' + (err.message || err));
        }
    };

    window.votePost = async (voteType) => {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { alert('Please log in to vote.'); return; }
        try {
            // Upsert vote (one vote per user per post)
            await supabase.from('votes').upsert({
                post_id: window._currentPostId,
                user_id: session.user.id,
                vote_type: voteType
            }, { onConflict: 'post_id,user_id' });
            // Re-fetch score
            const { data: vData } = await supabase.from('votes').select('*').eq('post_id', window._currentPostId);
            const score = (vData||[]).reduce((acc, curr) => acc + curr.vote_type, 0);
            const el = document.getElementById('vote-score-display');
            if (el) {
                el.textContent = (score>=0?'+':'')+score;
                el.style.color = score>0?'#E57373':score<0?'#22d3ee':'#94a3b8';
            }
            window.loadPosts();
        } catch (err) {
            console.error('Error voting:', err);
        }
    };

    window.closePostDetail = (e) => {
        if (e && e.target !== document.getElementById('post-detail-backdrop')) return;
        window.closePostDetailBtn();
    };

    window.closePostDetailBtn = () => {
        document.getElementById('post-detail-backdrop').style.display = 'none';
        document.body.style.overflow = '';
        window._currentPostId = null;
        document.getElementById('new-comment-input') && (document.getElementById('new-comment-input').value = '');
    };

    // Allow pressing Enter to submit comment (Shift+Enter for newline)
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            window.closePostDetailBtn();
            window.closeCreatePostModal();
        }
        if (e.key === 'Enter' && !e.shiftKey && document.activeElement?.id === 'new-comment-input') {
            e.preventDefault();
            window.submitComment();
        }
    });

    document.addEventListener('DOMContentLoaded', async () => {
        window.loadPosts();
        document.getElementById('create-post-backdrop').addEventListener('click', e => {
            if (e.target === document.getElementById('create-post-backdrop')) window.closeCreatePostModal();
        });
    });
</script>
</body>
</html>
